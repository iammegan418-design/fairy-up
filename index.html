<!DOCTYPE html>
<html lang="zh-Hant-TW" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>仙女飛升計畫</title>
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F2FF; --paper:#FFFFFF; --ink:#3D3170; --soft:#7A72A3; --line:#E7DFF7;
  --rose:#D9739F; --rose-soft:#F7E3EE; --gold:#C8902F; --gold-soft:#F8EBD2; --mint:#3E9C86; --mint-soft:#DDF1EB;
  --sky1:#C9DCFF; --sky2:#9C86E6; --sky3:#FFD6E8; --hero-line:#8A6FE0;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16132B; --paper:#211D3D; --ink:#EEEAFB; --soft:#A9A3C8; --line:#36305C;
    --rose:#EE8FB8; --rose-soft:#3D2442; --gold:#E3B45E; --gold-soft:#3B3020; --mint:#6CCBB3; --mint-soft:#1D3934;
    --sky1:#100D24; --sky2:#3B2F72; --sky3:#B4699A;
  }
}
:root[data-theme="dark"]{
  --bg:#16132B; --paper:#211D3D; --ink:#EEEAFB; --soft:#A9A3C8; --line:#36305C;
  --rose:#EE8FB8; --rose-soft:#3D2442; --gold:#E3B45E; --gold-soft:#3B3020; --mint:#6CCBB3; --mint-soft:#1D3934;
  --sky1:#100D24; --sky2:#3B2F72; --sky3:#B4699A;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}

/* Hero: the sky */
.sky{background:linear-gradient(160deg,#C9DCFF 0%,#E4D6FF 50%,#FFD9EA 100%);color:var(--ink);padding:22px 18px 0;position:relative;overflow:hidden}
.sky::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(to bottom,rgba(246,242,255,0),var(--bg));pointer-events:none}
.decor{position:absolute;inset:0;pointer-events:none}
.decor svg{position:absolute}
.bub{border-radius:50%;position:absolute;background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.95),rgba(255,255,255,.35) 45%,rgba(255,255,255,.1));border:1px solid rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(156,134,230,.18)}
@media (prefers-reduced-motion: no-preference){.bub{animation:floaty 7s ease-in-out infinite}.bub:nth-child(2n){animation-duration:9s;animation-delay:-3s}}
@keyframes floaty{50%{transform:translateY(-8px)}}
.sky-in{max-width:760px;margin:0 auto;position:relative;z-index:1}
.title{color:#4A3A8C;font-family:var(--serif);font-weight:900;font-size:clamp(2rem,8vw,3.1rem);line-height:1.1;margin:0;letter-spacing:.06em}
.sub{margin:6px 0 0;font-size:.9rem;opacity:.82}
.brand{display:flex;align-items:center;gap:14px}
.brand .logo{width:clamp(52px,14vw,68px);height:auto;flex:0 0 auto;border-radius:16px;box-shadow:0 8px 22px rgba(120,96,210,.3)}
.classline{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 14px;margin-top:14px}
.classname{font-family:var(--serif);font-weight:600;font-size:1.15rem}
.dayno{font-size:.9rem;opacity:.85}
.dayno b{font-size:1.4rem;font-weight:700;margin-right:2px}
.herochart{margin:10px -18px 0;display:block}
.herochart svg{display:block;width:100%;height:auto}
.heronote{margin-left:auto;text-align:right;font-size:.78rem;color:var(--soft);line-height:1.2}
.heronote b{display:block;font-family:var(--serif);font-size:1.45rem;line-height:1.1;color:#7A5FD6}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(246,242,255,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabs-in{max-width:760px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none;padding:0 8px}
.tabs-in::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:none;border:0;padding:13px 12px 11px;font-size:.95rem;color:var(--soft);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--rose)}

main{max-width:760px;margin:0 auto;padding:18px 16px 40px}
h2{font-family:var(--serif);font-weight:600;font-size:1.3rem;margin:4px 0 12px}
h3{font-size:1rem;margin:0 0 8px}
.panel{background:var(--paper);border:1px solid var(--line);box-shadow:0 6px 20px rgba(156,134,230,.08);border-radius:20px;padding:16px;margin-bottom:14px}
.muted{color:var(--soft);font-size:.88rem}
label{display:block;font-size:.85rem;color:var(--soft);margin:12px 0 5px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:1rem}
textarea{min-height:70px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:12px 20px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--bg);font-size:.98rem}
.btn.block{width:100%;margin-top:16px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500;padding:9px 14px;font-size:.9rem}
.btn.rose{background:var(--rose);color:#fff}
.btn.small{padding:7px 12px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;color:var(--rose);font-weight:700;cursor:pointer;padding:4px 0;font-size:.92rem}

/* Mode chooser */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer}
.mode b{display:block;font-family:var(--serif);font-size:1.05rem}
.mode span{font-size:.75rem;color:var(--soft)}
.mode[aria-pressed="true"]{border-color:var(--rose);background:var(--rose-soft)}

/* Stepper */
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:1.4rem;cursor:pointer}
.stepper output{font-family:var(--serif);font-size:2rem;font-weight:900;min-width:2ch;text-align:center}
.goalhint{font-size:.85rem}
.goalhint.ok{color:var(--mint);font-weight:700}

.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;padding:3px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--soft)}
.chip.rose{background:var(--rose-soft);border-color:transparent;color:var(--rose)}
.chip.mint{background:var(--mint-soft);border-color:transparent;color:var(--mint)}
.chip.gold{background:var(--gold-soft);border-color:transparent;color:var(--gold)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 4px}
.stat{text-align:center;padding:8px 2px}
.stat b{display:block;font-family:var(--serif);font-size:1.3rem;line-height:1.2}
.stat span{font-size:.72rem;color:var(--soft)}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--soft);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}

.donelist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* Guide */
.diag{border-radius:18px;padding:16px;margin-bottom:14px;border:1px solid var(--line);background:var(--paper)}
.diag .state{font-family:var(--serif);font-size:1.5rem;font-weight:900;margin:2px 0 6px}
.diag ol{margin:8px 0 0;padding-left:1.3em}
.diag li{margin:4px 0}
.diag.s-rise{border-left:6px solid var(--mint)}
.diag.s-warn{border-left:6px solid var(--gold)}
.diag.s-stop{border-left:6px solid var(--rose)}
.diag.s-new{border-left:6px solid var(--sky2)}
.out{margin-top:14px}
.outblock{border-top:1px solid var(--line);padding:12px 0 4px}
.outblock h3{display:flex;justify-content:space-between;align-items:center}
.hook{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.hook:last-child{border-bottom:0}
.pre{white-space:pre-wrap}

/* Overview */
.mcard{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.mcard:last-child{border-bottom:0}
.mname{font-weight:700;font-size:1.02rem}
.mmeta{font-size:.8rem;color:var(--soft)}
.mgain{text-align:right;font-family:var(--serif);font-weight:900;font-size:1.2rem;color:var(--mint)}
.mgain.neg{color:var(--rose)}
.bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--rose);border-radius:3px}
.mfoot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--soft);gap:8px;flex-wrap:wrap}
.editbox{grid-column:1/-1;background:var(--bg);border-radius:12px;padding:4px 12px 12px;margin-top:6px}

.empty{text-align:center;padding:28px 12px}
.empty p{color:var(--soft)}
.notice{font-size:.85rem;background:var(--gold-soft);color:var(--ink);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.92rem;transition:all .25s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{text-align:center;font-size:.78rem;color:var(--soft);padding:10px 0 30px}
@media (prefers-reduced-motion: reduce){.toast{transition:none}.rise path.ln{animation:none!important}}
.rise path.ln{stroke-dasharray:2000;stroke-dashoffset:2000;animation:draw 1.4s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

  Cloud.stop();
  Object.assign(S,{user:u,isAdmin:false,ready:false,loadErr:false,classId:null,cls:null,members:{},sel:'',editing:null,addOpen:false,newMember:{mode:1},lastProfile:null,ai:null,guideSel:'',chartSel:'all',tab:'checkin'});

  render();

    S.isAdmin=!!a;

/* ---------- calculations ---------- */
function range(){
  if(!S.cls)return[];
  const end=S.cls.end<today()?S.cls.end:today();
  const out=[];if(end<S.cls.start)return out;
  for(let d=S.cls.start;d<=end;d=addDays(d,1))out.push(d);
  return out;
}
function totalDays(){return S.cls?diff(S.cls.start,S.cls.end)+1:0}
function dayNo(){if(!S.cls)return 0;const n=diff(S.cls.start,today())+1;return Math.max(0,Math.min(n,totalDays()))}
function ended(){return S.cls&&today()>S.cls.end}
function followerSeries(m,dates){
  const logs=m.logs||{};let cur=Number(m.base)||0;
  const keys=Object.keys(logs).filter(k=>logs[k].followers!==''&&logs[k].followers!=null).sort();
  let i=0;
  return dates.map(d=>{while(i<keys.length&&keys[i]<=d){cur=Number(logs[keys[i]].followers);i++}return cur});
}
function latestFollowers(m){const logs=m.logs||{};const k=Object.keys(logs).filter(k=>logs[k].followers!==''&&logs[k].followers!=null).sort().pop();return k?Number(logs[k].followers):Number(m.base)||0}
function stats(m){
  const dates=range(),logs=m.logs||{},mode=Number(m.mode)||1;
  const achieved=dates.filter(d=>logs[d]&&Number(logs[d].videos)>=mode).length;
  const allAchieved=S.cls?Object.keys(logs).filter(d=>d>=S.cls.start&&d<=S.cls.end&&Number(logs[d].videos)>=mode).length:0;
  const videos=Object.values(logs).reduce((a,l)=>a+(Number(l.videos)||0),0);
  const now=latestFollowers(m),base=Number(m.base)||0;
  let streak=0;for(let i=dates.length-1;i>=0;i--){const l=logs[dates[i]];if(l&&Number(l.videos)>=mode)streak++;else if(i===dates.length-1&&!l)continue;else break}
  return{achieved,allAchieved,elapsed:dates.length,videos,now,base,gain:now-base,streak,today:!!logs[today()]};
}
function sortedMembers(){return Object.entries(S.members).map(([id,m])=>({id,...m})).sort((a,b)=>(a.name||'').localeCompare(b.name||'','zh-Hant'))}
function canEdit(m){return S.isAdmin||(S.user&&m&&m.userId===S.user.id)}

/* ---------- direction check ---------- */
function diagnose(m){
  const dates=range(),logs=m.logs||{},mode=Number(m.mode)||1,st=stats(m);
  const fs=followerSeries(m,dates),n=fs.length;
  const at=k=>n?fs[Math.max(0,Math.min(n-1,k))]:st.base;
  const gain7=n?at(n-1)-at(n-8):0,prev7=n>8?at(n-8)-at(n-15):0;
  const cons=st.elapsed?st.achieved/st.elapsed:0;
  let best=null,prev=Number(m.base)||0;
  Object.keys(logs).sort().forEach(d=>{const f=logs[d].followers;if(f===''||f==null)return;const g=Number(f)-prev;if(!best||g>best.g)best={d,g,note:logs[d].note||''};prev=Number(f)});
  const logged=Object.keys(logs).length;
  let s;
  if(!logged)s={cls:'s-new',state:'尚未起飛',why:'還沒有任何打卡紀錄，系統先等你的第一筆資料。',acts:['今天先拍一支，打卡時記下目前粉絲數，這就是你的起飛點','主題不用想太難：自我介紹、你為什麼開始、你的一天','選一個做得到的模式，先求不斷，再求多']};
  else if(cons<0.6)s={cls:'s-stop',state:'更新斷層',why:`目前達標 ${st.achieved}/${st.elapsed} 天，頻率斷掉時演算法很難記住你。`,acts:[mode>1?`接下來 7 天先降到「${MODES[mode-1].name}」，穩住不中斷再拉回來`:'接下來 7 天只要求自己「有發就好」，一支也算','前一晚先把隔天要拍的主題寫在打卡備註裡','用固定格式拍（同一個開場、同一個角度），降低每支的準備時間']};
  else if(gain7<=0&&st.elapsed>=4)s={cls:'s-warn',state:'平台期',why:'更新很穩，但近 7 天粉絲沒有往上，代表內容需要換角度。',acts:['只改開頭 3 秒：第一句直接說結果或反差','換一個沒拍過的主題類型（日常、問答、迷思破解輪流試）',best&&best.g>0?`回頭看 ${md(best.d)} 那支，成長最多，主題「${best.note||'未填'}」可以拍續集`:'每支在備註寫下主題，之後才看得出哪種內容有效']};
  else if(gain7>0&&gain7>prev7*1.3&&st.elapsed>=8)s={cls:'s-rise',state:'加速飛升',why:`近 7 天漲了 ${sign(gain7)}，比前一週更快，你找到有效的路了。`,acts:['把最近成長的主題做成系列，連拍 3 集',mode<3?`狀態好的話可以試試升級「${MODES[mode+1].name}」`:'維持三日更，加入一支固定的系列單元','留言區多回覆，把新粉絲留下來']};
  else s={cls:'s-rise',state:'穩定飛升',why:`達標 ${st.achieved}/${st.elapsed} 天，近 7 天 ${sign(gain7)}，節奏很健康。`,acts:['保持現在的頻率，不要突然加量','每週挑一支表現最好的，拆成 2 支不同角度再拍',best&&best.g>0?`${md(best.d)} 成長最多（主題「${best.note||'未填'}」），可以延伸`:'打卡時寫下主題，系統才能幫你找出最有效的內容']};
  return{...s,gain7,cons,best,st};
}

/* ---------- charts ---------- */
function chartSVG({dates,line,bars,goal,h=200,hero=false}){
  const W=640,H=h,pl=hero?14:46,pr=hero?14:12,pt=hero?18:14,pb=hero?8:26,n=dates.length;
  if(!n)return'';
  let min=Math.min(...line),max=Math.max(...line);if(min===max){min-=1;max+=1}
  const pv=(max-min)*.18;min=Math.max(0,min-pv);max+=pv;
  const x=i=>pl+(n===1?(W-pl-pr)/2:i*(W-pl-pr)/(n-1));
  const y=v=>pt+(1-(v-min)/(max-min))*(H-pt-pb);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="粉絲成長曲線" class="rise">`;
  s+=`<defs><linearGradient id="g${hero?'h':'c'}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${hero?'var(--hero-line)':'var(--rose)'};stop-opacity:${hero?.3:.25}"/><stop offset="1" style="stop-color:${hero?'var(--hero-line)':'var(--rose)'};stop-opacity:0"/></linearGradient></defs>`;
  if(!hero){
    for(let k=0;k<=3;k++){const v=min+(max-min)*k/3,yy=y(v);s+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" style="stroke:var(--line)" stroke-width="1"/><text x="${pl-6}" y="${yy+4}" text-anchor="end" font-size="11" style="fill:var(--soft)">${Math.round(v).toLocaleString()}</text>`}
    if(bars){const bmax=Math.max(goal||1,...bars,1),bh=(H-pt-pb)*.32,bw=Math.max(3,Math.min(16,(W-pl-pr)/n*.55));
      bars.forEach((b,i)=>{if(!b)return;const hh=b/bmax*bh;s+=`<rect x="${x(i)-bw/2}" y="${H-pb-hh}" width="${bw}" height="${hh}" rx="2" style="fill:${b>=goal?'var(--mint)':'var(--gold)'}" opacity=".75"/>`});
    }
    const step=Math.max(1,Math.ceil(n/6));dates.forEach((d,i)=>{if(i%step===0||i===n-1)s+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="11" style="fill:var(--soft)">${md(d)}</text>`});
  }
  const pts=line.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  const path=n===1?`M${x(0)-30},${y(line[0])} L${x(0)+30},${y(line[0])}`:'M'+pts.join(' L');
  s+=`<path d="${path} L${n===1?x(0)+30:x(n-1)},${H-pb} L${n===1?x(0)-30:x(0)},${H-pb} Z" fill="url(#g${hero?'h':'c'})"/>`;
  s+=`<path class="ln" d="${path}" fill="none" style="stroke:${hero?'var(--hero-line)':'var(--rose)'}" stroke-width="${hero?3:2.5}" stroke-linecap="round" stroke-linejoin="round"/>`;
  const lx=n===1?x(0):x(n-1),ly=y(line[n-1]);
  s+=`<circle cx="${lx}" cy="${ly}" r="${hero?6:5}" style="fill:${hero?'var(--hero-line)':'var(--rose)'}"/>`;
  if(hero)s+=`<circle cx="${lx}" cy="${ly}" r="12" style="fill:var(--hero-line)" opacity=".2"/>`;
  return s+'</svg>';
}
function teamSeries(){
  const dates=range(),ms=sortedMembers();
  if(!ms.length||!dates.length)return null;
  const per=ms.map(m=>followerSeries(m,dates));
  return{dates,line:dates.map((_,i)=>per.reduce((a,s)=>a+s[i],0)),bars:dates.map(d=>ms.filter(m=>m.logs&&m.logs[d]).length)};
}

    hooks:[`關於${t}，我以前也做錯過`,`如果你也在想${t}，先看完這支`,`${t}，我真實分享我的做法`],
    caption:`今天想聊聊「${t}」\n這是我自己的真實經驗，不一定適合每個人，但希望對你有一點幫助\n你也有類似的經驗嗎？留言跟我說 🤍\n#仙女日常 #真實分享`,
    nextTopics:[`${t}的常見迷思`,`我的${t}前後對比心得`,`粉絲問最多的${t}問題`]};
}

/* --- overview --- */
function viewAll(){
  const ms=sortedMembers().map(m=>({m,st:stats(m)})).sort((a,b)=>b.st.gain-a.st.gain);
  const T=totalDays(),fin=ended();
  let h=`<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="margin:0">班級總覽</h2><button class="btn small" data-act="line">複製 LINE 戰報</button></div><p class="muted" style="margin:6px 0 0">${fin?'班級已結業，下方為最終完成狀態。':`結業條件：${T} 天全部達標。`}</p>`;
  if(!ms.length)return h+`<p class="muted">還沒有成員。</p></div>`;
  ms.forEach(({m,st})=>{
    const mode=Number(m.mode)||1,pct=T?Math.round(st.allAchieved/T*100):0,complete=st.allAchieved>=T;
    h+=`<div class="mcard"><div><div class="mname">${esc(m.name)}</div><div class="mmeta">${MODES[mode].name}${m.upline?`｜引路仙女 ${esc(m.upline)}`:''}｜${num(st.base)} → ${num(st.now)}</div></div><div class="mgain ${st.gain<0?'neg':''}">${sign(st.gain)}</div>
    <div class="bar"><i style="width:${pct}%;${complete?'background:var(--mint)':''}"></i></div>
    <div class="mfoot"><span>${fin?(complete?'<span class="chip mint">完成飛升</span>':`<span class="chip">未完成</span>`):''} 達標 ${st.allAchieved}/${T} 天 ${st.today?'｜今日已打卡':''}</span>${canEdit(m)?`<button class="linkbtn" data-act="edit" data-id="${m.id}">${S.editing===m.id?'收起':'編輯'}</button>`:''}</div>`;
    if(S.editing===m.id&&canEdit(m)){
      h+=`<div class="editbox"><label for="e-name">名字</label><input type="text" id="e-name" value="${esc(m.name)}" maxlength="30"><label for="e-up">引路仙女</label><input type="text" id="e-up" value="${esc(m.upline||'')}" maxlength="30">
      <div class="row"><div><label for="e-mode">更新模式</label><select id="e-mode">${[1,2,3].map(k=>`<option value="${k}"${mode===k?' selected':''}>${MODES[k].name}</option>`).join('')}</select></div><div><label for="e-base">起始粉絲</label><input type="number" id="e-base" value="${esc(m.base)}"></div></div>
      <div style="display:flex;gap:8px;margin-top:14px;justify-content:${S.isAdmin?'space-between':'flex-end'}">${S.isAdmin?`<button class="btn ghost small" data-act="delm" data-id="${m.id}">移除這位仙女</button>`:''}<button class="btn small" data-act="savem" data-id="${m.id}">儲存</button></div></div>`;
    }
    h+=`</div>`;
  });
  return h+`</div>`;
}
function lineReport(){
  const t=today(),ms=sortedMembers().map(m=>({m,st:stats(m)})).filter(x=>x.st.today).sort((a,b)=>b.st.gain-a.st.gain);
  const all=sortedMembers(),gain=all.reduce((a,m)=>a+stats(m).gain,0);
  let s=`✨ 仙女飛升計畫｜${S.cls.name}\n${ended()?'已結業':`第 ${dayNo()} 天 / 共 ${totalDays()} 天`}（${md(t)}）\n今日已打卡 ${ms.length} 人\n\n`;
  ms.forEach((x,i)=>{const mode=Number(x.m.mode)||1,l=x.m.logs[t];s+=`${i+1}. ${x.m.name}${x.m.upline?`（上家 ${x.m.upline}）`:''}\n　${MODES[mode].name} ${Number(l.videos)>=mode?'✅':'⏳'} 今日 ${l.videos} 支｜粉絲 ${num(x.st.now)}（${sign(x.st.gain)}）\n`});
  if(ended()){const T=totalDays(),done=all.filter(m=>stats(m).allAchieved>=T);s+=`\n🏆 完成飛升 ${done.length} 人${done.length?'：'+done.map(m=>m.name).join('、'):''}\n`}
  s+=`\n全班累積漲粉 ${sign(gain)} 🚀`;
  return s;
}

/* --- settings --- */
function viewSet(){
  const c=S.cls,t=today();
  let h=`<div class="panel"><h2>我的帳號</h2><p style="margin:0">${esc(S.user.email||'')}</p><p class="muted" style="margin:4px 0 0">身分：${S.isAdmin?'團隊長（可查看與管理全班）':'仙女夥伴（可填寫與修改自己的紀錄）'}</p><button class="btn ghost small" style="margin-top:12px" data-act="logout">登出</button></div>`;
  if(!S.isAdmin){
    if(c)h+=`<div class="panel"><h2>目前班級</h2><p style="margin:0">${esc(c.name)}</p><p class="muted" style="margin:4px 0 0">${md(c.start)}–${md(c.end)}，共 ${totalDays()} 天</p></div>`;
    return h+`<div class="panel"><h3>使用方式</h3><p class="muted" style="margin:0">每天到「修煉打卡」填寫自己的支數和粉絲數。資料存在雲端，換手機用同一組 Email 和密碼登入就看得到。</p></div>`;
  }
  if(c)h+=`<div class="panel"><h2>目前班級</h2><label for="c-name">班級名稱</label><input type="text" id="c-name" value="${esc(c.name)}" maxlength="30"><div class="row"><div><label for="c-s">開始</label><input type="date" id="c-s" value="${c.start}"></div><div><label for="c-e">結束</label><input type="date" id="c-e" value="${c.end}"></div></div><button class="btn block" data-act="saveclass">儲存班級設定</button></div>`;
  h+=`<div class="panel"><h2>${c?'開新的一班':'建立班級'}</h2>${c?'<p class="muted" style="margin:0">開新班級後，大家會從新班重新打卡。舊班資料會保留在雲端但不再顯示。</p>':''}<label for="n-name">班級名稱</label><input type="text" id="n-name" placeholder="例：飛升 1 班" maxlength="30"><div class="row"><div><label for="n-s">開始</label><input type="date" id="n-s" value="${t}"></div><div><label for="n-e">結束</label><input type="date" id="n-e" value="${addDays(t,29)}"></div></div><button class="btn rose block" data-act="newclass">${c?'開新班級':'建立班級'}</button></div>`;
  h+=`<div class="panel"><h3>使用方式</h3><p class="muted" style="margin:0">一次只跑一個班級，大約一個月。仙女們打開連結、註冊登入後，第一次先加入班級就能打卡。每個人只能修改自己的紀錄，團隊長可以查看與修改全班。</p></div>`;
  return h;
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const tb=e.target.closest('[data-tab]');if(tb){S.tab=tb.dataset.tab;render();window.scrollTo({top:0});return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,v=k=>{const el=document.getElementById(k);return el?el.value.trim():''};
  if(act==='authmode'){S.authEmail=v('au-email');S.authMode=S.authMode==='login'?'signup':'login';render()}
  else if(act==='auth'){
    const email=v('au-email').toLowerCase(),pw=(document.getElementById('au-pw')||{}).value||'',reg=S.authMode==='signup';
    S.authEmail=email;
    if(!email||!pw){toast('請輸入 Email 和密碼');return}
    if(reg){if(pw.length<6){toast('密碼至少 6 碼');return}if(pw!==((document.getElementById('au-pw2')||{}).value||'')){toast('兩次輸入的密碼不一樣');return}}
    if(b.disabled)return;b.disabled=true;b.textContent='處理中…';
    let res;
    try{res=reg?await sb.auth.signUp({email,password:pw}):await sb.auth.signInWithPassword({email,password:pw})}
    catch(err){res={error:err}}
    if(res.error){toast(authMsg(res.error));b.disabled=false;b.textContent=reg?'註冊並登入':'登入';return}
    if(reg&&!res.data.session){toast('註冊成功，但需要信箱確認才能登入，請找團隊長協助');S.authMode='login';render();return}
    await onSession(res.data.session);
  }
  else if(act==='logout'){await sb.auth.signOut();await onSession(null)}
  else if(act==='goset'){S.tab='set';render()}
  else if(act==='toggleadd'){S.addOpen=!S.addOpen;render()}
  else if(act==='nmmode'){S.newMember.name=v('nm-name');S.newMember.upline=v('nm-up');S.newMember.base=v('nm-base');S.newMember.mode=+b.dataset.v;render()}
  else if(act==='addmember'){
    const name=v('nm-name');if(!name){toast('請輸入名字');return}
    if(sortedMembers().some(m=>m.name===name)){toast('這個名字已經有人用了，請換一個（例如加上 IG 名稱）');return}
    const data={name,upline:v('nm-up'),mode:S.newMember.mode||1,base:Math.max(0,Number(v('nm-base'))||0)};
    let id='';
    if(await guard(async()=>{id=await Cloud.addMember(data)},'歡迎加入飛升計畫')){S.sel=id;S.addOpen=false;S.newMember={mode:1};S.draft={date:today(),videos:0,followers:'',note:''};render()}
  }
  else if(act==='vid'){S.draft.videos=Math.max(0,Math.min(9,S.draft.videos+ +b.dataset.v));render()}
  else if(act==='checkin'){
    const m=S.members[S.sel];if(!m)return;const d=S.draft;
    if(!d.date||d.date<S.cls.start||d.date>S.cls.end){toast('日期要在班級期間內');return}
    if(d.date>today()){toast('不能幫未來打卡喔');return}
    const entry={videos:d.videos,followers:d.followers===''||d.followers==null?'':Math.max(0,Number(d.followers)||0),note:d.note||'',at:Date.now()};
    const mode=Number(m.mode)||1;
    if(await guard(()=>Cloud.checkin(S.sel,d.date,entry),d.videos>=mode?'打卡完成，今日達標':'打卡完成')){S.draft={date:today(),videos:0,followers:'',note:''};render()}
  }
  else if(act==='ai'){runAI()}
  else if(act==='copy'){const r=S.ai;if(!r)return;copyText(b.dataset.k==='hook'?r.hooks[+b.dataset.i]:r.caption)}
  else if(act==='line'){copyText(lineReport())}
  else if(act==='edit'){S.editing=S.editing===b.dataset.id?null:b.dataset.id;render()}
  else if(act==='savem'){const name=v('e-name');if(!name){toast('名字不能空白');return}
    if(await guard(()=>Cloud.updateMember(b.dataset.id,{name,upline:v('e-up'),mode:+v('e-mode')||1,base:Math.max(0,Number(v('e-base'))||0)}),'已儲存')){S.editing=null;render()}}
  else if(act==='delm'){const m=S.members[b.dataset.id];if(!m||!confirm(`確定移除「${m.name}」？她在這一班的打卡紀錄會一起刪除。`))return;
    if(await guard(()=>Cloud.deleteMember(b.dataset.id),'已移除')){S.editing=null;if(S.sel===b.dataset.id)S.sel='';render()}}
  else if(act==='saveclass'){const name=v('c-name'),s=v('c-s'),en=v('c-e');if(!name||!s||!en||en<s){toast('請確認名稱和日期（結束要在開始之後）');return}
    guard(()=>Cloud.saveClass({name,start:s,end:en}),'已儲存班級設定')}
  else if(act==='newclass'){const name=v('n-name'),s=v('n-s'),en=v('n-e');if(!name||!s||!en||en<s){toast('請確認名稱和日期（結束要在開始之後）');return}
    if(S.cls&&!confirm(`確定開新班級「${name}」？目前的班級會結束顯示。`))return;
    if(await guard(()=>Cloud.newClass({name,start:s,end:en}),'班級已建立')){S.sel='';S.tab='checkin';render()}}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.draft){S.draft[t.dataset.draft]=t.value}
  else if(t.dataset.bind==='aiTopic'){S.aiTopic=t.value}
});
document.addEventListener('change',e=>{
  const t=e.target,k=t.dataset.bind;
  if(t.dataset.draft==='date'){S.draft.date=t.value;const m=S.members[S.sel],l=m&&m.logs&&m.logs[t.value];S.draft.videos=l?Number(l.videos)||0:0;S.draft.followers=l?l.followers:'';S.draft.note=l?l.note||'':'';t.blur();render();return}
  if(!k||k==='aiTopic')return;
  S[k]=t.value;
  if(k==='sel'){const m=S.members[t.value],l=m&&m.logs&&m.logs[S.draft.date];S.draft.videos=l?Number(l.videos)||0:0;S.draft.followers=l?l.followers:'';S.draft.note=l?l.note||'':'';S.addOpen=false}
  if(k==='guideSel')S.ai=null;
  t.blur();render();
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&/^au-/.test(e.target.id)){const b=document.querySelector('[data-act="auth"]');if(b)b.click()}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.user)Cloud.soon()});

/* ---------- boot ---------- */
render();
(async()=>{
  if(!sb){S.fatal='雲端元件載入失敗，請確認網路後重新整理頁面。';render();return}
  try{const {data:{session}}=await sb.auth.getSession();await onSession(session)}
  catch(e){console.error(e);S.ready=true;render()}
  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==='SIGNED_IN'||ev==='SIGNED_OUT')setTimeout(()=>onSession(session),0);
  });
})();
</script>

const today=ymd(new Date());
const dayIndex=()=>Math.round((parse(today)-parse(start))/864e5); // 0-based
function morningMsg(i){const l=LESSONS[i];return`💡 今日短影音靈感 Day ${i+1}｜${l.t}\n\n🎬 開頭這樣說：\n「${l.h}」\n\n📱 畫面這樣拍：\n① ${l.s[0]}\n② ${l.s[1]}\n③ ${l.s[2]}\n\n✨ 小技巧：${l.k}\n\n不知道拍什麼的，今天就拍這個！拍完丟連結，大家互相留言 💕`}
const NOON="📱 白天：看到夥伴丟影片連結，就去留一句真心的話（不要只留表情符號）。妳回幾則就好。";
const PRAISE="今天最大突破是 @＿＿，粉絲 +＿＿！\n她＿＿＿＿（具體說她做對了什麼），大家可以學 👏";

function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),1800)}
function copy(text,btn){
  const ok=()=>toast("已複製，貼到群組就好");
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(ok,()=>fallback())}else fallback();
  function fallback(){const pre=btn.closest(".what").querySelector(".msg");if(pre){const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("已選取文字，請長按複製")}}
}

function renderToday(){
  const idx=dayIndex(),i=sel!=null?sel:Math.max(0,Math.min(29,idx)),date=addDays(start,i),wd=parse(date).getDay(),wk=WEEKLY[wd];
  const isToday=sel==null&&idx>=0&&idx<=29;
  $("#dayno").innerHTML=idx<0?`還沒開班・倒數 <b>${-idx}</b> 天`:idx>29?`已結業`:`第 <b>${idx+1}</b> 天 / 30`;
  $("#datetxt").textContent=`今天 ${md(today)}（${WD[parse(today).getDay()]}）`;
  const d=done[date]||{};
  let h=`<div class="slot" style="border-bottom:1px solid var(--line)"><div class="when">${isToday?"今天":"第 "+(i+1)+" 天"}<small>${md(date)}（${WD[wd]}）</small></div><div class="what"><h3>${isToday?"今天要在群組發這些":"這天要在群組發這些"}</h3>${sel!=null?`<div class="row"><button class="copy" data-act="back">回到今天</button></div>`:""}</div></div>`;
  h+=`<div class="slot"><div class="when">早上<small>今日靈感</small></div><div class="what"><h3>${esc(LESSONS[i].t)}</h3><div class="msg">${esc(morningMsg(i))}</div><div class="row"><button class="copy" data-copy="m">複製</button><button class="done" data-done="m" data-date="${date}" aria-pressed="${!!d.m}">${d.m?"✓ 已發":"發了點這裡"}</button></div></div></div>`;
  if(wk)h+=`<div class="slot"><div class="when">${WD[wd]==="日"?"晚上":"中午"}<small>週活動</small></div><div class="what"><h3><span class="chip gold">週${WD[wd]}</span> ${wk.name}</h3><div class="muted">${wk.how}</div><div class="msg">${esc(wk.msg)}</div><div class="row"><button class="copy" data-copy="w">複製</button></div></div></div>`;
  h+=`<div class="slot"><div class="when">白天<small>互動</small></div><div class="what"><div class="muted" style="font-size:.95rem">${NOON.slice(3)}</div></div></div>`;
  h+=`<div class="slot"><div class="when">晚上<small>戰報＋稱讚</small></div><div class="what"><div class="muted" style="font-size:.95rem">① 打開仙女飛升計畫 →「班級總覽」→ 按「複製 LINE 戰報」貼到群組<br>② 再補一句點名稱讚：</div><div class="msg">${esc(PRAISE)}</div><div class="row"><button class="copy" data-copy="p">複製稱讚範本</button><button class="done" data-done="e" data-date="${date}" aria-pressed="${!!d.e}">${d.e?"✓ 已貼戰報":"貼了點這裡"}</button></div></div></div>`;
  $("#today").innerHTML=h;
  $("#today").dataset.i=i;
}
function renderList(){
  const idx=dayIndex();let h="",cm=0,ce=0;
  LESSONS.forEach((l,i)=>{const t=l.t;const date=addDays(start,i),wd=parse(date).getDay(),d=done[date]||{};if(d.m)cm++;if(d.e)ce++;
    h+=`<div class="item${i===idx?" is-today":""}${i===sel?" is-sel":""}" data-sel="${i}"><span class="d"><b>${i+1}</b>${md(date)} ${WD[wd]}</span><span class="t">${esc(t)}${WEEKLY[wd]?`<span class="chip gold">${WEEKLY[wd].name}</span>`:""}</span><span class="ticks"><span class="tick${d.m?" on":""}" title="早上靈感">早</span><span class="tick${d.e?" on":""}" title="晚上戰報">晚</span></span><button class="copy" data-copyday="${i}">複製</button></div>`});
  $("#list").innerHTML=h;$("#progress").textContent=`早上靈感 ${cm}/30・晚上戰報 ${ce}/30`;
}
function render(){renderToday();renderList()}

$("#start").value=start;
$("#start").addEventListener("change",e=>{if(!e.target.value)return;start=e.target.value;store.set("start",start);sel=null;render();toast("開班日已更新")});
document.addEventListener("click",e=>{
  const cd=e.target.closest("[data-copyday]");if(cd){const k=+cd.dataset.copyday;const t=morningMsg(k);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast(`已複製 Day ${k+1}，貼到群組就好`),()=>{sel=k;render();toast("請在上方長按文字複製")})}else{sel=k;render()}return}
  const b=e.target.closest("button,[data-sel]");if(!b)return;
  const i=+$("#today").dataset.i,wd=parse(addDays(start,i)).getDay();
  if(b.dataset.copy==="m")copy(morningMsg(i),b);
  else if(b.dataset.copy==="w")copy(WEEKLY[wd].msg,b);
  else if(b.dataset.copy==="p")copy(PRAISE,b);
  else if(b.dataset.done){const dt=b.dataset.date,k=b.dataset.done;done[dt]=done[dt]||{};done[dt][k]=!done[dt][k];store.set("done",done);render()}
  else if(b.dataset.sel!=null){sel=+b.dataset.sel===dayIndex()?null:+b.dataset.sel;render();window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}
  else if(b.dataset.act==="back"){sel=null;render()}
});
render();
</script>
</body>
</html>
